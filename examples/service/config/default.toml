[app]
  env             = "dev"
  serviceName     = "my-service"
  port            = "8080"
  metricsPort     = "8002"
  shutdownTimeout = 5
  shutdownDelay   = 2
  gitCommitHash   = "unknown"

[database]
  host     = "localhost"
  port     = 5432
  username = "root"
  password = "dev-password"
  name     = "myapp"
  sslMode  = "disable"

  [database.pool]
    maxOpenConnections    = 10
    maxIdleConnections    = 5
    connectionMaxLifetime = 300

[kafka]
  brokers   = ["localhost:9092"]
  enableTLS = false
  groupID   = "my-consumer"

[auth]
  token          = "dev-token"
  tokenHeaderKey = "X-Auth-Key"

[sentry]
  dsn     = ""
  enabled = false
